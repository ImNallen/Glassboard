name: Pages

on:
  push:
    branches: [main]
    paths:
      - apps/web/**
      - packages/ui/**
      - assets/brand/**
      - package.json
      - package-lock.json
      - .github/workflows/pages.yml
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'release' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.repository.default_branch || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/configure-pages@v6
        id: pages
      - run: npm run ui check
      - run: npm run web check
      - run: npm run ui test
      - run: npm run web test
      - run: npm run web build
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
      - run: npm run web verify:downloads
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/dist

  deploy:
    needs: build
    if: github.event_name == 'release' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
