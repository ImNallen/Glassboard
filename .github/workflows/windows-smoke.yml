name: Windows smoke
on:
  pull_request:
    paths:
      - apps/desktop/**
      - packages/ui/**
      - scripts/windows/**
      - .github/workflows/windows-smoke.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/desktop/src-tauri
      - run: npm ci
      - run: npm run tauri --workspace apps/desktop -- build --bundles nsis
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install pillow==12.1.0
      - name: Run the smoke checks
        shell: pwsh
        run: |
          $setup = Get-ChildItem apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          python scripts/windows/smoke.py $setup.FullName "$env:RUNNER_TEMP/windows-smoke"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-smoke
          path: ${{ runner.temp }}/windows-smoke
          if-no-files-found: warn
