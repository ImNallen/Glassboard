version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        update-types: [minor, patch]
  - package-ecosystem: cargo
    directory: /apps/desktop/src-tauri
    schedule:
      interval: weekly
    groups:
      cargo:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /scripts/linux
    schedule:
      interval: weekly
    groups:
      docker:
        update-types: [minor, patch]
    ignore:
      # rust-toolchain.toml owns the Rust version; bump it and this image together.
      - dependency-name: rust
