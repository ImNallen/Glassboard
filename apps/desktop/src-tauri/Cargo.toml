[package]
name = "glassboard"
version = "0.1.0"
description = "A quiet tool for directing attention"
authors = ["Glassboard"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
xcap = "0.9.8"
arboard = "3.6.1"
image = { version = "0.25.10", default-features = false, features = ["png"] }

# Screen capture includes full-display pixel conversion loops. Keep these fast
# even in local debug bundles while Glassboard's own code stays debuggable.
[profile.dev.package.xcap]
opt-level = 3

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWindow"] }
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging", "Win32_Graphics_Dwm"] }
